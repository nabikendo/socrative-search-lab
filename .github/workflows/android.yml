name: Atlas Android

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Anexar o APK à release da versão do package.json'
        type: boolean
        default: false
  push:
    branches:
      - feat/atlas-desktop-hardening
      - main
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Preparar a chave de assinatura
        env:
          KEYSTORE_B64: ${{ secrets.ATLAS_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ATLAS_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then echo "Faltam os segredos da chave de assinatura do APK."; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/atlas-release.p12"
          echo "ATLAS_KEYSTORE=$RUNNER_TEMP/atlas-release.p12" >> "$GITHUB_ENV"
          echo "ATLAS_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ATLAS_KEY_ALIAS=atlas" >> "$GITHUB_ENV"
      - name: Gerar o APK
        run: |
          VERSION=$(node -p "require('./package.json').version")
          export ATLAS_VERSION_NAME="$VERSION"
          export ATLAS_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))
          gradle -p android assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
          mkdir -p dist-apk
          cp android/app/build/outputs/apk/release/app-release.apk "dist-apk/Atlas-Android-$VERSION.apk"
      - name: Conferir a assinatura
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs dist-apk/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Atlas-Android
          path: dist-apk/*.apk
          if-no-files-found: error
      - name: Registrar o erro em uma issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '```'; tail -n 70 build.log 2>/dev/null || echo "sem log do Gradle"; echo '```'; } > falha.md
          gh issue create --repo "$GITHUB_REPOSITORY" --title "Falha no build do APK (execução $GITHUB_RUN_ID)" --body-file falha.md || true

  release-apk:
    needs: build-apk
    if: (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish atlas apk]')) || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Atlas-Android
          path: dist-apk
      - name: Anexar o APK à versão
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls dist-apk/Atlas-Android-*.apk)
          VERSION=$(basename "$APK" .apk | sed 's/^Atlas-Android-//')
          gh release upload "v$VERSION" "$APK" --repo "$GITHUB_REPOSITORY" --clobber
