name: Atlas Desktop Windows

on:
  workflow_dispatch:
  push:
    branches:
      - feat/atlas-desktop-hardening
      - release/atlas-descritores-beta-20261115
      - fix/atlas-132-beta-auditoria
      - release/atlas-1.3.3-stable
      - main
    paths:
      - 'desktop/**'
      - 'server.mjs'
      - 'lib/**'
      - 'shared/**'
      - 'src/**'
      - 'test/**'
      - '*.html'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop-windows.yml'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24' # o mesmo Node que o Electron 43 embute no aplicativo
      - name: Instalar dependências
        run: npm ci --no-audit --no-fund
      - name: Testes automatizados
        run: npm test
      - name: Gerar instalador
        run: npm run desktop:package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verificar os arquivos do instalador e do atualizador
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $installer = "release-desktop/Atlas-Setup-$version-x64.exe"
          $manifestName = if ($version -match '-beta\.') { 'beta.yml' } else { 'latest.yml' }
          $required = @($installer, "$installer.blockmap", "release-desktop/$manifestName", "release-desktop/win-unpacked/resources/app-update.yml")
          foreach ($file in $required) {
            if (!(Test-Path -LiteralPath $file -PathType Leaf) -or (Get-Item -LiteralPath $file).Length -eq 0) {
              throw "Arquivo ausente ou vazio: $file"
            }
          }
          $hash = [Convert]::ToBase64String([Convert]::FromHexString((Get-FileHash -LiteralPath $installer -Algorithm SHA512).Hash))
          $manifest = Get-Content -Raw -LiteralPath "release-desktop/$manifestName"
          if (!$manifest.Contains($hash)) { throw "O manifesto $manifestName não corresponde ao instalador." }
      - name: Abrir o Atlas empacotado e conferir o painel
        shell: pwsh
        run: |
          $exe = Resolve-Path "release-desktop/win-unpacked/Atlas.exe"
          $app = Start-Process -FilePath $exe -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 30 -and !$ready; $attempt++) {
              if ($app.HasExited) { throw "O Atlas fechou na inicialização (código $($app.ExitCode))." }
              $sockets = Get-NetTCPConnection -OwningProcess $app.Id -State Listen -ErrorAction SilentlyContinue
              foreach ($socket in $sockets) {
                try {
                  $page = Invoke-WebRequest -Uri "http://127.0.0.1:$($socket.LocalPort)/professor" -TimeoutSec 2
                  if ($page.StatusCode -eq 200 -and $page.Content -like "*Painel do professor*") {
                    $ready = $true
                    break
                  }
                } catch {
                  continue
                }
              }
              if (!$ready) { Start-Sleep -Seconds 1 }
            }
            if (!$ready) { throw "O painel do professor não abriu no Atlas empacotado." }
          } finally {
            if (!$app.HasExited) { Stop-Process -Id $app.Id }
          }
      - name: Guardar arquivos de distribuição
        uses: actions/upload-artifact@v4
        with:
          name: Atlas-Desktop-Windows
          path: |
            release-desktop/*.exe
            release-desktop/*.exe.blockmap
            release-desktop/beta.yml
            release-desktop/latest.yml
          if-no-files-found: error

  release-windows:
    needs: build-windows
    if: github.event_name == 'push' && (contains(github.event.head_commit.message, '[publish atlas beta]') || contains(github.event.head_commit.message, '[publish atlas stable]'))
    runs-on: windows-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Atlas-Desktop-Windows
          path: release-desktop
      - name: Publicar versão
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          $installer = Get-ChildItem -LiteralPath "release-desktop" -Filter "Atlas-Setup-*-x64.exe"
          if (@($installer).Count -ne 1 -or $installer.Name -notmatch '^Atlas-Setup-(\d+\.\d+\.\d+)(-beta\.\d+)?-x64\.exe$') {
            throw "O instalador deve ter uma versão estável (1.2.0) ou beta (1.2.0-beta.1)."
          }
          $version = "$($Matches[1])$($Matches[2])"
          $isBeta = [bool]$Matches[2]
          $tag = "v$version"
          $files = @($installer.FullName, "$($installer.FullName).blockmap")
          if ($isBeta) {
            if ($env:COMMIT_MESSAGE -notlike '*[[]publish atlas beta[]]*') { throw "Versão beta exige a marca [publish atlas beta] na mensagem do commit." }
            $files += "release-desktop/beta.yml"
            gh release create $tag @files --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --prerelease --title "Atlas $version para Windows" --notes "Pré-lançamento do Atlas para Windows."
          } else {
            if ($env:COMMIT_MESSAGE -notlike '*[[]publish atlas stable[]]*') { throw "Versão estável exige a marca [publish atlas stable] na mensagem do commit." }
            # Beta users may upgrade to stable using beta.yml, while stable clients read latest.yml.
            Copy-Item -LiteralPath "release-desktop/latest.yml" -Destination "release-desktop/beta.yml" -Force
            $files += "release-desktop/latest.yml"
            $files += "release-desktop/beta.yml"
            $notes = @"
          Atlas $version — versão estável Windows (64 bits).

          Correção importante:
          - As abas Prova, Banco, Descritores, Resultados e Ajuda ficavam em branco na versão 1.3.3 (só a aba Turma aparecia)
          - O painel agora cria a seção que faltava e mostra uma mensagem na própria aba se algo falhar ao carregar, em vez de deixá-la vazia
          - Novo teste automático confere que toda aba tem botão e seção na página

          Inclui tudo da 1.3.3: interface renovada, catálogo SAEB, proteção de atualizações com prova ativa e regra do Firewall só para redes privadas.
          Versão não assinada digitalmente. Testes automáticos não substituem homologação presencial em sala.
          "@
            gh release create $tag @files --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --latest --title "Atlas $version para Windows" --notes $notes
            # os pacotes ZIP (com o Node 26 embutido) são montados à parte e anexados a esta mesma versão
            gh workflow run pacotes.yml --repo "$env:GITHUB_REPOSITORY" --ref "$env:GITHUB_REF_NAME" -f tag=$tag
          }
