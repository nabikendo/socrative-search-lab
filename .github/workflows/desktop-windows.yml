name: Atlas Desktop Windows (pré-lançamento)

on:
  workflow_dispatch:
  workflow_dispatch:
  push:
    branches:
      - feat/atlas-desktop-hardening
    paths:
      - 'desktop/**'
      - 'server.mjs'
      - 'lib/**'
      - 'shared/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop-windows.yml'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@2w
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm ci --no-audit --no-fund
      - name: Testes automatizados
        run: npm test
      - name: Compilar interface
        run: npm run build
      - name: Confirmar que a versão ainda não foi publicada
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          $releases = gh release list --repo "${{ github.repository }}" --limit 100 --json tagName | ConvertFrom-Json
          $releaseExists = @($releases | Where-Object { $_.tagName -eq $tag }).Count -gt 0
          if ($releaseExists) { throw "A versão $tag já existe; não substituir um pré-lançamento publicado." }
      - name: Gerar instalador e publicar pré-lançamento
        run: npx electron-builder --win nsis --x64 --publish always
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ github.token }}
      - name: Guardar instalador de teste
        uses: actions/upload-artifact@v4
        with:
          name: Atlas-Desktop-Windows-Teste
          path: release-desktop/*.exe
          if-no-files-found: error