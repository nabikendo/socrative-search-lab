name: Pacotes prontos para usar

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_RUNTIME: 22.16.0   # versão do Node.js que vai dentro dos pacotes

jobs:
  pacotes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Dependências só de produção
        run: rm -rf node_modules && npm ci --omit=dev

      - name: Baixar o Node.js de cada sistema
        run: |
          base="https://nodejs.org/dist/v${NODE_RUNTIME}"
          mkdir -p dl && cd dl
          for f in "node-v${NODE_RUNTIME}-win-x64.zip" "node-v${NODE_RUNTIME}-darwin-arm64.tar.gz" "node-v${NODE_RUNTIME}-darwin-x64.tar.gz" "node-v${NODE_RUNTIME}-linux-x64.tar.xz"; do
            curl -fsSLO "$base/$f"
          done
          curl -fsSLO "$base/SHASUMS256.txt"
          grep -E "node-v${NODE_RUNTIME}-(win-x64\.zip|darwin-arm64\.tar\.gz|darwin-x64\.tar\.gz|linux-x64\.tar\.xz)$" SHASUMS256.txt | sha256sum -c -
          unzip -q "node-v${NODE_RUNTIME}-win-x64.zip"
          for f in *.tar.*; do tar -xf "$f"; done

      - name: Montar os pacotes
        run: |
          chmod +x scripts/package.sh
          scripts/package.sh Atlas-Windows windows "dl/node-v${NODE_RUNTIME}-win-x64/node.exe"
          scripts/package.sh Atlas-Mac-AppleSilicon unix "dl/node-v${NODE_RUNTIME}-darwin-arm64/bin/node"
          scripts/package.sh Atlas-Mac-Intel unix "dl/node-v${NODE_RUNTIME}-darwin-x64/bin/node"
          scripts/package.sh Atlas-Linux unix "dl/node-v${NODE_RUNTIME}-linux-x64/bin/node"

      - name: Publicar na página Releases (quando há uma tag)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/*.zip --title "Atlas $GITHUB_REF_NAME" --generate-notes

      - name: Guardar os pacotes (execução manual)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: pacotes
          path: release/*.zip
