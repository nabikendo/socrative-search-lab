name: Testes

on:
  push:
    branches: [main, feat/atlas-desktop-hardening]
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    # Node 24 é o que o aplicativo do Windows (Electron 43) embute; Node 26 é o dos pacotes ZIP.
    strategy:
      fail-fast: false
      matrix:
        node: ['24', '26']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
