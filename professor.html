<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Atlas — Professor</title>
    <link rel="stylesheet" href="/src/styles/base.css" />
    <link rel="stylesheet" href="/src/styles/professor.css" />
  </head>
  <body>
    <main id="login" class="center-screen" hidden>
      <form id="login-form" class="stack" style="width: min(360px, 100%)">
        <div class="stack-s">
          <h1 class="title-m">Painel do professor</h1>
          <p class="lead" style="font-size: 17px">Digite o PIN mostrado na janela preta do Atlas (ou no arquivo data/pin.txt).</p>
        </div>
        <input id="pin" class="code-input" type="password" inputmode="numeric" autocomplete="one-time-code" placeholder="••••••" aria-label="PIN do professor" />
        <p id="login-error" class="error" role="alert"></p>
        <button class="btn big block" type="submit">Entrar</button>
      </form>
    </main>

    <div id="app" hidden>
      <header class="topbar">
        <div class="topbar-inner">
          <a class="brand" href="/">Atlas</a>
          <nav class="tabs-wrap" aria-label="Seções">
            <div class="segmented" role="tablist">
              <button role="tab" data-tab="turma">Turma</button>
              <button role="tab" data-tab="prova">Prova</button>
              <button role="tab" data-tab="resultados">Resultados</button>
              <button role="tab" data-tab="ajuda">Ajuda</button>
            </div>
          </nav>
          <button id="logout" class="btn quiet" type="button">Sair</button>
        </div>
      </header>
      <main class="page wide">
        <section id="tab-turma" hidden></section>
        <section id="tab-prova" hidden></section>
        <section id="tab-resultados" hidden></section>
        <section id="tab-ajuda" hidden></section>
      </main>
    </div>
    <script type="module" src="/src/professor/main.js"></script>
  </body>
</html>
