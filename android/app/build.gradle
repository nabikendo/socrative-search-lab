plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.atlas.provas'
    compileSdk 34

    defaultConfig {
        applicationId 'br.com.atlas.provas'
        minSdk 26
        targetSdk 34
        versionCode (System.getenv('ATLAS_VERSION_CODE') ?: '1').toInteger()
        versionName System.getenv('ATLAS_VERSION_NAME') ?: '1.2.0'
    }

    signingConfigs {
        release {
            def keystore = System.getenv('ATLAS_KEYSTORE')
            if (keystore) {
                storeFile file(keystore)
                storePassword System.getenv('ATLAS_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ATLAS_KEY_ALIAS')
                keyPassword System.getenv('ATLAS_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('ATLAS_KEYSTORE')) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
